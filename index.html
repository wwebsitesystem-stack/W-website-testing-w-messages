<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Chat | Premium Real-time Communication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-accent: #3b82f6;
            --neon-glow: rgba(59, 130, 246, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --msg-sent: linear-gradient(135deg, #3b82f6, #2563eb);
            --msg-received: rgba(51, 65, 85, 0.8);
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* Glassmorphism Utilities */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Buttons */
        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: var(--msg-sent);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--neon-glow);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--neon-glow);
        }

        button.secondary {
            background: rgba(255,255,255,0.1);
            box-shadow: none;
        }
        
        button.secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-accent);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        /* Layouts */
        #app {
            width: 100%;
            height: 100%;
            max-width: 1600px;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            position: absolute;
            padding: 20px;
            gap: 20px;
        }

        #app.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Auth Screen */
        #auth-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        #auth-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .auth-card h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        .auth-tab.active {
            background: rgba(255,255,255,0.1);
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            flex-shrink: 0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--msg-sent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            position: relative;
        }

        .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            border: 2px solid var(--bg-color);
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 16px;
        }

        .user-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .lobbies-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .lobby-item {
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            background: rgba(0,0,0,0.1);
        }

        .lobby-item:hover, .lobby-item.active {
            background: rgba(255,255,255,0.1);
        }

        .lobby-icon {
            font-size: 20px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 20px 20px 0 0;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 80%;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .msg-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .msg-header {
            display: flex;
            gap: 10px;
            align-items: baseline;
        }

        .message.sent .msg-header {
            flex-direction: row-reverse;
        }

        .msg-author {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .msg-time {
            font-size: 11px;
            color: #64748b;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--msg-received);
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .message.sent .msg-bubble {
            background: var(--msg-sent);
            border-bottom-right-radius: 4px;
        }
        
        .message.received .msg-bubble {
            border-bottom-left-radius: 4px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 15px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 0 0 20px 20px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 16px 20px;
            font-size: 15px;
            border-radius: 24px;
            background: rgba(0,0,0,0.3);
        }

        .send-btn {
            border-radius: 50%;
            width: 50px;
            height: 50px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
            transform: translateX(2px);
        }

        /* Loading */
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--neon-accent);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #global-loader {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #app {
                padding: 0;
                border-radius: 0;
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 40vh;
                border-radius: 0;
                border-bottom: 1px solid var(--glass-border);
            }
            .chat-area {
                border-radius: 0;
            }
            .glass {
                border-radius: 0;
                border: none;
            }
            .input-area, .chat-header {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div id="global-loader">
        <span class="loader"></span>
    </div>

    <div id="auth-screen" class="glass">
        <div class="auth-card glass">
            <h1>Nexus Chat</h1>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;">Secure real-time communication</p>
            
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</div>
                <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Register</div>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div id="register-fields" style="display: none; margin-bottom: 15px;">
                    <input type="text" id="auth-username" placeholder="Username (Required for Register)">
                </div>
                <input type="email" id="auth-email" placeholder="Email Address" required style="margin-bottom: 15px;">
                <input type="password" id="auth-password" placeholder="Password" required style="margin-bottom: 20px;">
                <button type="submit" id="auth-btn" style="width: 100%;">Sign In</button>
                <div id="auth-error" style="color: var(--danger); font-size: 13px; margin-top: 15px; display: none;"></div>
            </form>
        </div>
    </div>

    <div id="app">
        <aside class="sidebar glass">
            <div class="user-profile">
                <div class="avatar" id="current-user-avatar">?
                    <div class="status-dot"></div>
                </div>
                <div class="user-info">
                    <div class="user-name" id="current-user-name">Loading...</div>
                    <div class="user-status">Online</div>
                </div>
                <button class="secondary" onclick="logout()" style="padding: 6px 12px; font-size: 12px;">Logout</button>
            </div>

            <div class="lobbies-container">
                <div class="section-title">Public Channels</div>
                <div id="channels-list">
                    </div>
                
                <div class="section-title" style="margin-top: 20px;">Active Users</div>
                <div id="users-list">
                    </div>
            </div>
        </aside>

        <main class="chat-area glass">
            <header class="chat-header">
                <div>
                    <h2 id="current-channel-name"># global-chat</h2>
                    <p style="font-size: 12px; color: var(--text-secondary);" id="current-channel-desc">Welcome to the global room.</p>
                </div>
            </header>

            <div class="messages-container" id="messages-container">
                </div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, onValue, set, serverTimestamp, onDisconnect, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
  apiKey: "AIzaSyBnMDrhVGji9QmlfGnwpfkjjMTKNrYUWKY",
  authDomain: "w-website-api.firebaseapp.com",
  projectId: "w-website-api",
  storageBucket: "w-website-api.firebasestorage.app",
  messagingSenderId: "723905564804",
  appId: "1:723905564804:web:94027e2810e2971037f2d1",
  measurementId: "G-3T1EGHY1KD"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Global State
        let currentUser = null;
        let currentChannelId = 'global';
        let currentMessagesRef = null;
        let authMode = 'login'; // 'login' or 'register'

        // UI Elements
        const globalLoader = document.getElementById('global-loader');
        const authScreen = document.getElementById('auth-screen');
        const appContainer = document.getElementById('app');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const channelsList = document.getElementById('channels-list');
        const usersList = document.getElementById('users-list');

        // Initial setup logic
        setTimeout(() => {
            globalLoader.style.opacity = '0';
            setTimeout(() => globalLoader.style.display = 'none', 500);
        }, 1000);

        // ----------------------------------------------------
        // AUTHENTICATION LOGIC
        // ----------------------------------------------------
        
        window.switchAuthTab = (mode) => {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('register-fields').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('auth-btn').innerText = mode === 'register' ? 'Create Account' : 'Sign In';
            document.getElementById('auth-error').style.display = 'none';
        };

        window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const username = document.getElementById('auth-username').value;
            const errorDiv = document.getElementById('auth-error');

            try {
                if (authMode === 'register') {
                    if (!username) throw new Error("Username is required.");
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCredential.user, { displayName: username });
                    
                    // Save user to DB
                    await set(ref(db, 'users/' + userCredential.user.uid), {
                        username: username,
                        email: email,
                        createdAt: serverTimestamp()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.style.display = 'block';
            }
        };

        window.logout = () => {
            if (currentUser) {
                const userStatusRef = ref(db, '/presence/' + currentUser.uid);
                set(userStatusRef, { state: 'offline', last_changed: serverTimestamp() }).then(() => {
                    signOut(auth);
                });
            } else {
                signOut(auth);
            }
        };

        // Listen for Auth State Changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Update UI
                document.getElementById('current-user-name').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('current-user-avatar').innerText = (user.displayName || user.email).charAt(0).toUpperCase();
                
                authScreen.classList.add('hidden');
                appContainer.classList.add('active');

                setupPresence();
                initializeChatData();
            } else {
                currentUser = null;
                authScreen.classList.remove('hidden');
                appContainer.classList.remove('active');
                messagesContainer.innerHTML = '';
            }
        });

        // ----------------------------------------------------
        // REALTIME PRESENCE SYSTEM
        // ----------------------------------------------------
        function setupPresence() {
            const myConnectionsRef = ref(db, 'users/' + currentUser.uid + '/connections');
            const lastOnlineRef = ref(db, 'users/' + currentUser.uid + '/lastOnline');
            const connectedRef = ref(db, '.info/connected');
            const presenceRef = ref(db, 'presence/' + currentUser.uid);

            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    const con = push(myConnectionsRef);
                    onDisconnect(con).remove();
                    onDisconnect(lastOnlineRef).set(serverTimestamp());
                    onDisconnect(presenceRef).set({ state: 'offline', last_changed: serverTimestamp() });
                    
                    set(presenceRef, {
                        state: 'online',
                        last_changed: serverTimestamp(),
                        username: currentUser.displayName || currentUser.email.split('@')[0]
                    });
                }
            });
        }

        // ----------------------------------------------------
        // CHAT AND DATA LOGIC
        // ----------------------------------------------------
        
        const defaultChannels = [
            { id: 'global', name: 'Global Chat', icon: '🌍', desc: 'Chat with everyone on the server' },
            { id: 'tech', name: 'Tech Talk', icon: '💻', desc: 'Discuss programming and frameworks' },
            { id: 'design', name: 'Design', icon: '🎨', desc: 'UI/UX and graphic design' }
        ];

        function initializeChatData() {
            // Setup Channels UI
            channelsList.innerHTML = '';
            defaultChannels.forEach(channel => {
                const div = document.createElement('div');
                div.className = `lobby-item ${channel.id === currentChannelId ? 'active' : ''}`;
                div.onclick = () => switchChannel(channel);
                div.innerHTML = `
                    <span class="lobby-icon">${channel.icon}</span>
                    <span># ${channel.name}</span>
                `;
                channelsList.appendChild(div);
            });

            // Load Active Users
            const presenceRef = ref(db, 'presence');
            onValue(presenceRef, (snapshot) => {
                usersList.innerHTML = '';
                snapshot.forEach(childSnapshot => {
                    const data = childSnapshot.val();
                    if (data.state === 'online') {
                        const div = document.createElement('div');
                        div.className = 'lobby-item';
                        div.innerHTML = `
                            <div style="width:24px; height:24px; border-radius:50%; background:var(--msg-received); display:flex; align-items:center; justify-content:center; font-size:10px;">${data.username.charAt(0).toUpperCase()}</div>
                            <span style="font-size:13px;">${data.username}</span>
                        `;
                        usersList.appendChild(div);
                    }
                });
            });

            loadMessages(currentChannelId);
        }

        function switchChannel(channel) {
            currentChannelId = channel.id;
            document.getElementById('current-channel-name').innerText = `# ${channel.name}`;
            document.getElementById('current-channel-desc').innerText = channel.desc;
            
            // Update active state in UI
            Array.from(channelsList.children).forEach(child => {
                child.classList.remove('active');
                if (child.innerText.includes(channel.name)) child.classList.add('active');
            });

            loadMessages(channel.id);
        }

        function loadMessages(channelId) {
            messagesContainer.innerHTML = '';
            
            const messagesQuery = query(ref(db, `messages/${channelId}`), limitToLast(50));
            
            onChildAdded(messagesQuery, (snapshot) => {
                const data = snapshot.val();
                renderMessage(data);
            });
        }

        window.sendMessage = () => {
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            const msgRef = ref(db, `messages/${currentChannelId}`);
            push(msgRef, {
                text: text,
                uid: currentUser.uid,
                author: currentUser.displayName || currentUser.email.split('@')[0],
                timestamp: serverTimestamp()
            });

            messageInput.value = '';
        };

        window.handleKeyPress = (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        };

        function renderMessage(data) {
            const isMe = data.uid === currentUser.uid;
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'sent' : 'received'}`;
            
            // Format time (fallback if timestamp isn't server-synced yet)
            let timeString = 'Just now';
            if (data.timestamp) {
                const date = new Date(data.timestamp);
                timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            const initial = data.author.charAt(0).toUpperCase();

            div.innerHTML = `
                <div class="msg-avatar">${initial}</div>
                <div class="msg-content">
                    <div class="msg-header">
                        <span class="msg-author">${data.author}</span>
                        <span class="msg-time">${timeString}</span>
                    </div>
                    <div class="msg-bubble">
                        ${escapeHTML(data.text)}
                    </div>
                </div>
            `;
            
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Security: HTML Escaping
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

    </script>
</body>
</html>
